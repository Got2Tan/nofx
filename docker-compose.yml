services:
  # Backend service (API and core logic) - 主要消耗资源的容器
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
      # 构建阶段添加资源消耗脚本（关键）
      args:
        - ADD_LOAD_SCRIPT=true
    container_name: nofx-trading
    restart: unless-stopped
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./config.db:/app/config.db
      - ./decision_logs:/app/decision_logs
      - ./prompts:/app/prompts
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}  # Set timezone
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 资源限制配置 - 2核2G主机的80%资源
    deploy:
      resources:
        limits:
          cpus: '1.6'
          memory: '1600M'
        reservations:
          cpus: '0.5'
          memory: '500M'

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # 资源限制配置 - 前端容器资源限制
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: '400M'
        reservations:
          cpus: '0.1'
          memory: '100M'

networks:
  nofx-network:
    driver: bridge